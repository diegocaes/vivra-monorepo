appId: ${APP_ID}
name: Navegación principal sin pantallas blancas
tags:
  - smoke
  - navigation
---
- launchApp
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
- tapOn: "Tab Inicio"
- extendedWaitUntil:
    visible:
      text: "Tab Inicio"
      selected: true
    timeout: 15000
# The development warning toast overlaps the tab bar on iOS.
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          text: ".*Open debugger to view warnings.*"
          point: "94%,50%"
- repeat:
    times: 3
    commands:
      - tapOn: "Tab Salud"
      - assertVisible:
          text: "Tab Salud"
          selected: true
      - assertVisible:
          id: "health-vaccines"
      - tapOn: "Tab Comida"
      - assertVisible:
          text: "Tab Comida"
          selected: true
      - assertVisible:
          id: "screen-food"
      - tapOn: "Tab Perfil"
      - assertVisible:
          text: "Tab Perfil"
          selected: true
      - assertVisible:
          id: "screen-profile"
      - scrollUntilVisible:
          element:
            text: "Gastos totales"
          direction: DOWN
          centerElement: true
      - assertVisible: "Gastos totales"
      - tapOn: "Tab Inicio"
      - assertVisible:
          text: "Tab Inicio"
          selected: true
- tapOn: "Tab Salud"
- assertVisible:
    text: "Tab Salud"
    selected: true
- scrollUntilVisible:
    element:
      id: "health-grooming"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "health-grooming"
- assertVisible:
    id: "screen-grooming"
- tapOn:
    id: "grooming-back"
- assertVisible:
    text: "Tab Salud"
    selected: true
- assertNotVisible: "Vuelos"
