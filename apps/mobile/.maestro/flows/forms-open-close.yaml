appId: ${APP_ID}
name: Formularios principales abren y cierran sin bloquear
tags:
  - smoke
  - forms
---
- launchApp
- runFlow:
    when:
      true: ${APP_ID == "host.exp.Exponent"}
    commands:
      - openLink: "exp://localhost:8081"
      - extendedWaitUntil:
          visible: "Tab Inicio"
          timeout: 25000
- tapOn: "Tab Inicio"
- extendedWaitUntil:
    visible:
      text: "Tab Inicio"
      selected: true
    timeout: 15000
# The development warning toast overlaps the tab bar on iOS.
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          text: ".*Open debugger to view warnings.*"
          point: "94%,50%"
- tapOn: "Tab Cuidado"
- tapOn: "Grooming"
- assertVisible:
    id: "screen-grooming"
- tapOn:
    id: "grooming-add"
    point: "15%,50%"
- assertVisible: "Agregar grooming"
- assertVisible: "Cancelar"
- tapOn: "Cancelar"
- assertNotVisible: "Agregar grooming"
- assertVisible:
    id: "screen-grooming"
- tapOn:
    id: "grooming-back"
- tapOn: "Tab Salud"
- scrollUntilVisible:
    element:
      id: "health-preventives"
    direction: UP
    centerElement: true
- tapOn:
    id: "health-preventives"
- assertVisible: "Registrar combinado"
- tapOn: "Registrar combinado"
# Long titles previously pushed Cancelar beyond the screen edge.
- assertVisible: "Agregar Combinado.*"
- assertVisible:
    id: "form-cancel"
- assertVisible: "Guardar"
- tapOn:
    id: "preventive-product"
- inputText: "Borrador de prueba"
- assertVisible:
    id: "form-cancel"
- assertVisible: "Guardar"
- scrollUntilVisible:
    element:
      id: "preventive-notes"
    direction: DOWN
- tapOn:
    id: "preventive-notes"
- inputText: "Sin guardar"
- assertVisible: "Guardar"
- tapOn:
    id: "form-cancel"
- assertNotVisible: "Agregar Combinado.*"
- assertVisible: "Registrar combinado"
- tapOn: "Registrar combinado"
- assertNotVisible: "Borrador de prueba"
- assertNotVisible: "Sin guardar"
- tapOn:
    id: "form-cancel"
