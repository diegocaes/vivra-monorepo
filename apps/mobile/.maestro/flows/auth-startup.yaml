appId: ${APP_ID}
name: Inicio estable sin sesión
tags:
  - smoke
  - startup
---
- launchApp
- extendedWaitUntil:
    visible: "Empezar"
    timeout: 15000
- assertVisible: "Ya tengo una cuenta"
- repeat:
    times: 3
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "Empezar"
          timeout: 10000
