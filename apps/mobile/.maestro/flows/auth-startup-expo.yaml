appId: host.exp.Exponent
name: Inicio estable sin sesión en Expo Go
tags:
  - smoke
  - startup
  - expo-go
---
- launchApp
- tapOn: "http://localhost:8081"
- extendedWaitUntil:
    visible: "Empezar"
    timeout: 15000
- assertVisible: "Ya tengo una cuenta"
- repeat:
    times: 3
    commands:
      - stopApp
      - launchApp
      - tapOn: "http://localhost:8081"
      - extendedWaitUntil:
          visible: "Empezar"
          timeout: 10000
