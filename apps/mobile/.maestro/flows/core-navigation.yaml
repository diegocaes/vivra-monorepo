appId: ${APP_ID}
name: Navegación principal sin pantallas blancas
tags:
  - smoke
  - navigation
---
- launchApp
- runFlow:
    when:
      true: ${APP_ID == "host.exp.Exponent"}
    commands:
      - openLink: "exp://localhost:8081"
      - extendedWaitUntil:
          visible: "Tab Inicio"
          timeout: 25000
- tapOn: "Tab Inicio"
- extendedWaitUntil:
    visible:
      text: "Tab Inicio"
      selected: true
    timeout: 15000
# The development warning toast overlaps the tab bar on iOS.
- runFlow:
    when:
      visible: ".*Open debugger to view warnings.*"
    commands:
      - tapOn:
          text: ".*Open debugger to view warnings.*"
          point: "94%,50%"
- repeat:
    times: 3
    commands:
      - tapOn: "Tab Salud"
      - assertVisible:
          text: "Tab Salud"
          selected: true
      - assertVisible:
          id: "health-vaccines"
      - tapOn: "Tab Cuidado"
      - assertVisible:
          text: "Tab Cuidado"
          selected: true
      - assertVisible:
          id: "screen-care"
      - tapOn: "Alimentación"
      - assertVisible:
          id: "screen-food"
      - assertVisible: "Alimentación"
      - tapOn: "Volver a Cuidado"
      - tapOn: "Tab Viajes"
      - assertVisible:
          id: "passport-identity"
      - assertVisible: "Pasaporte de mascota"
      - assertVisible: "Viajes y requisitos"
      - tapOn: "Abrir pasaporte"
      - assertVisible: "Registro de vacunas"
      - tapOn: "Volver"
      - tapOn: "Tab Más"
      - assertVisible:
          text: "Tab Más"
          selected: true
      - assertVisible:
          id: "screen-more"
      - tapOn: "Gastos"
      - assertVisible: "Gastos totales"
      - tapOn: "Tab Inicio"
      - assertVisible:
          text: "Tab Inicio"
          selected: true
      - assertVisible: "Alimentación"
- tapOn: "Tab Salud"
- assertVisible:
    id: "health-weight"
- assertNotVisible: "Grooming"
- tapOn: "Tab Cuidado"
- assertNotVisible: "Preventivos"
- assertNotVisible: "Peso"
- tapOn: "Grooming"
- assertVisible:
    id: "screen-grooming"
- tapOn:
    id: "grooming-back"
- assertVisible:
    text: "Tab Cuidado"
    selected: true
- assertVisible:
    id: "screen-care"
- tapOn: "Tab Más"
- tapOn: "Mi mascota"
- assertVisible: "Abrir sección Datos de.*"
- assertNotVisible: "Gastos totales"
- tapOn: "Volver a Más"
- tapOn: "Mi cuenta"
- assertVisible: "Cerrar sesión"
- assertNotVisible: "Abrir sección Datos de.*"
- tapOn: "Volver a Más"
- assertVisible:
    id: "screen-more"
